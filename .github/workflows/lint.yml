# Partially vibe coded with Kagi Assistant
name: Lint

on:
  push:
  pull_request:

jobs:
  lint_format_and_typing:
    name: Ruff & ty
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: "true"

      - name: uv sync
        run: uv sync

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run ty type checker
        run: ty check .

  lint_license:
    name: Reuse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: "true"

      - name: uv sync
        run: uv sync

      - name: Run Reuse linter
        run: reuse lint
